<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <title>Agregar nueva actividad</title>
    <link rel="stylesheet" href="css/formulario.css">
</head>
<body>
    <h1>Agregar nueva actividad recreativa</h1>
    <form id="form-actividad">
        <!-- ¿Dónde? -->
        <fieldset>
            <legend>¿Dónde?</legend>
            <label for="region">Región:</label>
            <select id="region" name="region">
                <option value="">Seleccione una región</option>
            </select><br><br>

            <label for="comuna">Comuna:</label>
            <select id="comuna" name="comuna" disabled>
                <option value="">Seleccione una comuna</option>
            </select><br><br>

            <label for="sector">Sector (opcional):</label>
            <input type="text" id="sector" name="sector" maxlength="100">
        </fieldset>
        
        <!-- ¿Quién organiza? -->
        <fieldset>
            <legend>¿Quién organiza?</legend>
            <label for="nombre">Nombre del organizador:</label>
            <input type="text" id="nombre" name="nombre" maxlength="200"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" maxlength="100"><br><br>

            <label for="telefono">Número de celular:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="+569.12345678"><br><br>

            <label for="contactar">Contactar por:</label><br>
            <div id="contactar-options">
                <input type="checkbox" id="whatsapp" name="contactar" value="whatsapp"> WhatsApp<br>
                <input type="checkbox" id="telegram" name="contactar" value="telegram"> Telegram<br>
                <input type="checkbox" id="x" name="contactar" value="x"> X<br>
                <input type="checkbox" id="instagram" name="contactar" value="instagram"> Instagram<br>
                <input type="checkbox" id="tiktok" name="contactar" value="tiktok"> TikTok<br>
                <input type="checkbox" id="otra" name="contactar" value="otra"> Otra<br>
            </div>
            <div id="info-contacto"></div>
        </fieldset>

        <!-- ¿Cuándo y de qué trata? -->
        <fieldset>
            <legend>¿Cuándo y de qué trata?</legend>
            <label for="inicio">Día y hora de inicio:</label>
            <input type="datetime-local" id="inicio" name="inicio"><br><br>

            <label for="termino">Día y hora de término (opcional):</label>
            <input type="datetime-local" id="termino" name="termino"><br><br>

            <label for="descripcion">Descripción (opcional):</label><br>
            <textarea id="descripcion" name="descripcion" cols="50" rows="10"></textarea><br><br>

            <label for="tema">Tema:</label>
            <select id="tema" name="tema">
                <option value="">Seleccione un tema</option>
                <option value="música">Música</option>
                <option value="deporte">Deporte</option>
                <option value="ciencias">Ciencias</option>
                <option value="religión">Religión</option>
                <option value="política">Política</option>
                <option value="tecnología">Tecnología</option>
                <option value="juegos">Juegos</option>
                <option value="baile">Baile</option>
                <option value="comida">Comida</option>
                <option value="otro">Otro</option>
            </select>
            <div id="otro-tema"></div><br><br>

            <label for="foto1">Foto:</label>
            <input type="file" id="foto1" name="foto[]" accept="image/*"><br>
            <button type="button" id="agregar-foto">Agregar otra foto</button><br><br>
            <div id="fotos-extra"></div>
        </fieldset>

        <!-- Botón final -->
        <button type="submit">Agregar esta actividad</button>
    </form>

    <!-- Aquí irá el mensaje de confirmación con opciones Sí / No -->
    <div id="confirmacion" style="display: none;">
        <p>¿Está seguro que desea agregar esta actividad?</p>
        <button id="confirmar-si">Sí, estoy seguro</button>
        <button id="confirmar-no">No, no estoy seguro, quiero volver al formulario</button>
    </div>

    <!-- Mensaje de éxito -->
    <div id="mensaje-final" style="display: none;">
        <p>Hemos recibido su información, muchas gracias y suerte en su actividad.</p>
        <button onclick="location.href='index.html'">Volver a la portada</button>
    </div>

    <script type="module" src="js/formulario.js"></script>
</body>
</html>
