<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <title>Estadísticas de Actividades</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Inclusión de Chart.js -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estadisticas.css') }}">
</head>
<body>
    <div class="header">
        <h1>Estadísticas de Actividades Recreativas</h1>
    </div>

    <div class="container">
        <!-- Gráfico de líneas: Actividades por Día -->
        <div class="grafico">
            <h3>Actividades por Día de la Semana</h3>
            <canvas id="graficoLineas"></canvas> <!-- Aquí irá el gráfico -->
        </div>

        <!-- Gráfico de torta: Actividades por Tipo -->
        <div class="grafico">
            <h3>Actividades por Tipo</h3>
            <canvas id="graficoTorta"></canvas> <!-- Aquí irá el gráfico -->
        </div>

        <!-- Gráfico de barras: Actividades por Mes y Hora -->
        <div class="grafico">
            <h3>Actividades por Mes y Hora</h3>
            <canvas id="graficoBarras"></canvas> <!-- Aquí irá el gráfico -->
        </div>

        <!-- Enlace para volver a la portada -->
        <div class="botones">
            <button class="boton" onclick="location.href='{{ url_for('portada')}}'">Volver a la portada</button>
        </div>
    </div>

    <script>
        // Gráfico de Líneas: Actividades por Día
        const datosActividadesPorDia = {
            labels: ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'],
            datasets: [{
                label: 'Actividades por Día',
                data: [5, 3, 6, 4, 7, 9, 8],
                borderColor: '#4e73df',
                backgroundColor: 'rgba(78, 115, 223, 0.2)',
                fill: true,
                tension: 0.4
            }]
        };

        const configLineas = {
            type: 'line',
            data: datosActividadesPorDia,
            options: {
                responsive: true,
                scales: {
                    x: {
                        beginAtZero: true,
                        ticks: {
                            font: { size: 14 }
                        }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: {
                            font: { size: 14 }
                        }
                    }
                }
            }
        };

        // Gráfico de Torta: Actividades por Tipo
        const datosActividadesPorTipo = {
            labels: ['Escuela de Boxeo', 'Frutas Deshidratadas', 'Cerámica', 'Pintura', 'Huerta Urbana'],
            datasets: [{
                data: [5, 4, 3, 2, 6],
                backgroundColor: ['#4e73df', '#1cc88a', '#36b9cc', '#f6c23e', '#e74a3b'],
                hoverBackgroundColor: ['#2e59d9', '#17a673', '#2c9faf', '#f4b731', '#e23a2d']
            }]
        };

        const configTorta = {
            type: 'pie',
            data: datosActividadesPorTipo,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top'
                    },
                    tooltip: {
                        callbacks: {
                            label: function(tooltipItem) {
                                return 'Actividades: ' + tooltipItem.raw;
                            }
                        }
                    }
                }
            }
        };

        // Gráfico de Barras: Actividades por Mes y Hora
        const datosActividadesPorMesYHora = {
            labels: ['Enero', 'Febrero', 'Marzo', 'Abril'],
            datasets: [
                {
                    label: 'Mañana',
                    data: [2, 5, 3, 4],
                    backgroundColor: '#4e73df'
                },
                {
                    label: 'Mediodía',
                    data: [3, 2, 4, 5],
                    backgroundColor: '#36b9cc'
                },
                {
                    label: 'Tarde',
                    data: [4, 6, 5, 3],
                    backgroundColor: '#1cc88a'
                }
            ]
        };

        const configBarras = {
            type: 'bar',
            data: datosActividadesPorMesYHora,
            options: {
                responsive: true,
                scales: {
                    x: {
                        beginAtZero: true,
                        ticks: {
                            font: { size: 14 }
                        }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: {
                            font: { size: 14 }
                        }
                    }
                },
                plugins: {
                    legend: {
                        position: 'top'
                    },
                    tooltip: {
                        callbacks: {
                            label: function(tooltipItem) {
                                return 'Actividades: ' + tooltipItem.raw;
                            }
                        }
                    }
                }
            }
        };

        // Crear los gráficos
        const ctxLineas = document.getElementById('graficoLineas').getContext('2d');
        const graficoLineas = new Chart(ctxLineas, configLineas);

        const ctxTorta = document.getElementById('graficoTorta').getContext('2d');
        const graficoTorta = new Chart(ctxTorta, configTorta);

        const ctxBarras = document.getElementById('graficoBarras').getContext('2d');
        const graficoBarras = new Chart(ctxBarras, configBarras);
    </script>
</body>
</html>
