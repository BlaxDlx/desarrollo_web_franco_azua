<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <title>Estadísticas de Actividades</title>
    <script src="https://code.highcharts.com/highcharts.js"></script> <!-- Inclusión de HighCharts.js -->
    <link rel="stylesheet" th:href="@{/css/estadisticas.css}"> <!-- Referencia al archivo CSS -->
    <script type="module" th:src="@{/js/estadisticas.js}"></script> <!-- Referencia al archivo JavaScript -->
</head>
<body>
    <div class="header">
        <h1>Estadísticas de Actividades Recreativas</h1>
    </div>

    <div class="container">
        <!-- Gráfico de líneas: Actividades por Día -->
        <div class="grafico">
            <h3>Actividades por Día de la Semana</h3>
            <div id="graficoLineas"></div> <!-- Aquí irá el gráfico -->
        </div>

        <!-- Gráfico de torta: Actividades por Tipo -->
        <div class="grafico">
            <h3>Actividades por Tipo</h3>
            <div id="graficoTorta"></div> <!-- Aquí irá el gráfico -->
        </div>

        <!-- Gráfico de barras: Actividades por Mes y Hora -->
        <div class="grafico">
            <h3>Actividades por Mes y Hora</h3>
            <div id="graficoBarras"></div> <!-- Aquí irá el gráfico -->
        </div>

        <!-- Enlace para volver a la portada -->
        <div class="botones">
            <button class="boton" th:onclick="'location.href=\'' + @{/} + '\''">🏠 Volver a la portada</button>
        </div>
    </div>
</body>
</html>
